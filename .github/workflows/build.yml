#
# Arch is the only distribution the project claims to support, so it is the one
# the tests run on: the same KF6 the README asks for, from the same repositories.

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install the dependencies from the README
        run: |
          pacman -Syu --noconfirm --needed git cmake extra-cmake-modules gettext \
            qt6-base kcoreaddons kio ki18n knotifications karchive kwidgetsaddons

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: address and undefined behaviour
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install the dependencies from the README
        run: |
          pacman -Syu --noconfirm --needed git cmake extra-cmake-modules gettext \
            qt6-base kcoreaddons kio ki18n knotifications karchive kwidgetsaddons

      - uses: actions/checkout@v4

      - name: Configure with the sanitizers on
        run: cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug -DECM_ENABLE_SANITIZERS='address;undefined'

      - name: Build
        run: cmake --build build-asan -j"$(nproc)"

      # Leak detection is off on purpose: KIO keeps plugin instances for the
      # life of the process, so what it reports is its own caching, not ours.
      # See PLAN.md section 3.10.
      - name: Test
        run: ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=print_stacktrace=1 ctest --test-dir build-asan --output-on-failure

  package:
    name: build the released package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install the build tooling
        run: pacman -Syu --noconfirm --needed git cmake extra-cmake-modules sudo

      - uses: actions/checkout@v4

      # makepkg refuses to run as root, and the container is root.
      - name: Make a user for makepkg
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder .

      # This is the whole point of the job: it proves the checksum in the
      # PKGBUILD matches the tarball GitHub serves for the tag, and that the
      # released sources build on a machine that has never seen this project.
      - name: makepkg from the tag
        run: sudo -u builder bash -c 'cd packaging && makepkg -s --noconfirm'

      - name: Show what the package holds
        run: bsdtar -tf packaging/*.pkg.tar.zst | grep -v '/$'
